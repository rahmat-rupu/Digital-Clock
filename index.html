<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="card inter-tight">
        <header class="header">
          <h3 class="clock">DIGITAL CLOCK</h3>
          <p class="pm">PM</p>
        </header>
        <div class="main share-tech-mono">
          <div class="hours">00</div>
          <div class="separator">:</div>
          <div class="minutes">00</div>
          <div class="separator">:</div>
          <div class="seconds">00</div>
        </div>
        <div class="info inter-tight">
          <p>HOURS</p>
          <p>MINUTES</p>
          <p>SECONDS</p>
        </div>
        <div class="date_day">
          <p class="day">THURSDAY</p>
          <p class="date">JUNE 26, 2025</p>
        </div>
        <div class="creator">Made by @Rupu</div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
